name: IOFireWireFamily PPC64 plugin source regression

on:
  pull_request:
    branches:
      - PowerPC
    paths:
      - src/powerpc/IOFireWireFamily-426.4.1/IOFireWireFamily.xcodeproj/project.pbxproj
      - src/releases/10.6.8/IOFireWireFamily-426.4.1/IOFireWireFamily.xcodeproj/project.pbxproj
      - patches/IOFireWireFamily-426.4.1-ppc64-plugin.patch
      - patches/IOFireWireFamily-426.4.1-ppc64-plugin.json
      - tests/test_iofirewirefamily_ppc64_plugin.py
      - .github/workflows/iofirewirefamily-ppc64-source.yml
  push:
    branches:
      - PowerPC
    paths:
      - src/powerpc/IOFireWireFamily-426.4.1/IOFireWireFamily.xcodeproj/project.pbxproj
      - src/releases/10.6.8/IOFireWireFamily-426.4.1/IOFireWireFamily.xcodeproj/project.pbxproj
      - patches/IOFireWireFamily-426.4.1-ppc64-plugin.patch
      - patches/IOFireWireFamily-426.4.1-ppc64-plugin.json
      - tests/test_iofirewirefamily_ppc64_plugin.py
      - .github/workflows/iofirewirefamily-ppc64-source.yml

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Verify official source delta and plugin architecture settings
        run: python3 -m unittest discover -s tests -p 'test_iofirewirefamily_ppc64_plugin.py' -v
