name: Historical PPC source lock

on:
  pull_request:
    branches:
      - PowerPC
  push:
    branches:
      - PowerPC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Verify historical Apple source gitlinks and lock
        run: python3 tools/verify_historical_sources.py
