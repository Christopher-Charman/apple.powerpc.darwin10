name: BerkeleyDB PPC mutex source regression

on:
  pull_request:
    branches:
      - PowerPC
    paths:
      - src/powerpc/BerkeleyDB-18/db/dbinc/mutex_int.h
      - src/releases/10.6.8/BerkeleyDB-18/db/dbinc/mutex_int.h
      - patches/BerkeleyDB-18-ppc-mutex.patch
      - tests/test_berkeleydb_ppc_mutex.py
      - .github/workflows/berkeleydb-ppc-mutex-source.yml
  push:
    branches:
      - PowerPC
    paths:
      - src/powerpc/BerkeleyDB-18/db/dbinc/mutex_int.h
      - src/releases/10.6.8/BerkeleyDB-18/db/dbinc/mutex_int.h
      - patches/BerkeleyDB-18-ppc-mutex.patch
      - tests/test_berkeleydb_ppc_mutex.py
      - .github/workflows/berkeleydb-ppc-mutex-source.yml

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Verify BerkeleyDB PowerPC mutex source and exact patch
        run: python3 -m unittest discover -s tests -p 'test_berkeleydb_ppc_mutex.py' -v
