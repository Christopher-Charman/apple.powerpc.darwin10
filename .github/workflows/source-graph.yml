name: Darwin source graph integrity

on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'src/apple-darwin-10.6.8/**'
      - 'src/releases/**'
      - 'historical/**'
      - 'historical-vendored/**'
      - 'patches/**'
      - 'tools/ppc_patch_gate.py'
      - 'tools/verify_historical_sources.py'
      - 'tools/verify_release_parity.py'
      - 'tools/verify_notify_contract.py'
      - 'tools/compare_ppc_sources.py'
      - 'tools/inspect_ppc_macho.py'
      - 'tools/verify_ppc_artifact_manifest.py'
      - 'tools/inspect_build_zip.py'
      - 'tests/test_build_zip_inventory.py'
      - 'tests/test_build_macho_load_commands.py'
      - 'tools/verify_ppc_dependency_sources.py'
      - 'tools/verify_darwinbuild_context.py'
      - 'tools/verify_ppc_historical_context.py'
      - 'docs/provenance/**'
      - 'tools/verify_developer_seed_lineage.py'
      - 'tests/test_developer_seed_lineage.py'
      - 'tests/test_darwinbuild_context.py'
      - 'tooling/darwinbuild/**'
      - 'tests/test_ppc_dependency_sources.py'
      - 'docs/build_zip_direct_binary_inventory.json'
      - 'tests/test_ppc_artifact_manifest.py'
      - 'tests/test_inspect_ppc_macho.py'
      - 'tests/test_release_source_contracts.py'
      - 'source-releases/**'
      - 'tools/verify_source_graph.py'
      - '.github/workflows/source-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Verify exact release source mappings
        run: |
          python3 tools/verify_source_graph.py
          python3 tools/verify_historical_sources.py
          python3 tools/verify_release_parity.py
          python3 tools/verify_notify_contract.py
          python3 -m unittest discover -s tests -p "test_ppc_patch_gate.py" -v
          python3 -m unittest discover -s tests -p "test_release_source_contracts.py" -v
          python3 -m unittest discover -s tests -p "test_inspect_ppc_macho.py" -v
          python3 -m unittest discover -s tests -p "test_ppc_artifact_manifest.py" -v
          python3 -m unittest discover -s tests -p "test_build_zip_inventory.py" -v
          python3 -m unittest discover -s tests -p "test_build_macho_load_commands.py" -v
          python3 -m unittest discover -s tests -p "test_ppc_dependency_sources.py" -v
          python3 -m unittest discover -s tests -p "test_darwinbuild_context.py" -v
          python3 tools/verify_ppc_historical_context.py
          python3 tools/verify_developer_seed_lineage.py
          python3 -m unittest discover -s tests -p "test_developer_seed_lineage.py" -v
