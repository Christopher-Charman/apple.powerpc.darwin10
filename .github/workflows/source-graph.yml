name: Darwin source graph integrity

on:
  pull_request:
    branches:
      - PowerPC
  push:
    branches:
      - PowerPC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Verify exact release source mappings
        run: |
          python3 tools/verify_source_graph.py
          python3 tools/verify_historical_sources.py
          python3 tools/verify_release_parity.py
          python3 tools/verify_notify_contract.py
          python3 -m unittest discover -s tests -p "test_ppc_patch_gate.py" -v
          python3 -m unittest discover -s tests -p "test_release_source_contracts.py" -v
          python3 -m unittest discover -s tests -p "test_inspect_ppc_macho.py" -v
          python3 -m unittest discover -s tests -p "test_ppc_artifact_manifest.py" -v
          python3 -m unittest discover -s tests -p "test_build_zip_inventory.py" -v
          python3 -m unittest discover -s tests -p "test_build_macho_load_commands.py" -v
          python3 -m unittest discover -s tests -p "test_ppc_dependency_sources.py" -v
          python3 -m unittest discover -s tests -p "test_darwinbuild_context.py" -v
          python3 tools/verify_ppc_historical_context.py
          python3 tools/verify_developer_seed_lineage.py
          python3 -m unittest discover -s tests -p "test_developer_seed_lineage.py" -v
          python3 -m unittest discover -s tests -p "test_ppc_source_guards.py" -v
          python3 -m unittest discover -s tests -p "test_dspasswordserverplugin_ppc_ref_decode.py" -v
          python3 -m unittest discover -s tests -p "test_xnu_ppc_kpi_pipefail.py" -v
          python3 -m unittest discover -s tests -p "test_xnu_ppc_linker_pipeline.py" -v
          python3 -m unittest discover -s tests -p "test_xnu_ppc_kpi_atomic.py" -v
          python3 -m unittest discover -s tests -p "test_xnu_ppc_linker_atomic.py" -v
          python3 -m unittest discover -s tests -p "test_xnu_ppc_kpi_preflight.py" -v
          python3 -m unittest discover -s tests -p "test_xnu_ppc_linker_exports.py" -v
          python3 -m unittest discover -s tests -p "test_xnu_ppc_kpi_list.py" -v
          python3 -m unittest discover -s tests -p "test_iohidfamily_ppc_arch.py" -v
          python3 -m unittest discover -s tests -p "test_autofs_ppc_arch.py" -v
          python3 -m unittest discover -s tests -p "test_smb_ppc_valid_arch.py" -v
          python3 -m unittest discover -s tests -p "test_diskdev_nofs_ppc_arch.py" -v
          python3 -m unittest discover -s tests -p "test_dtrace_ppc_arch.py" -v
          python3 -m unittest discover -s tests -p "test_dyld_ppc_assembly_abi.py" -v
          python3 -m unittest discover -s tests -p "test_libsystem_ppc_linker.py" -v
          python3 -m unittest discover -s tests -p "test_dyld_ppc_static_arch.py" -v
          python3 -m unittest discover -s tests -p "test_ioata_ppc_abstract_registers.py" -v
          python3 -m unittest discover -s tests -p "test_apple16x50serial_ppc_target.py" -v
          python3 -m unittest discover -s tests -p "test_ppc_cross_compile.py" -v
          python3 -m unittest discover -s tests -p "test_cf_ppc64_halt.py" -v
