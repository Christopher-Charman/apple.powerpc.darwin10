name: IODVD KEXT PPC source regression

on:
  pull_request:
    branches:
      - PowerPC
    paths:
      - src/powerpc/IODVDStorageFamily-30/IODVDStorageFamily.xcodeproj/project.pbxproj
      - src/releases/10.6.8/IODVDStorageFamily-30/IODVDStorageFamily.xcodeproj/project.pbxproj
      - patches/IODVDStorageFamily-30-ppc-kext-arch.patch
      - tests/test_iodvd_kext_ppc_arch.py
      - .github/workflows/iodvd-kext-ppc-source.yml
  push:
    branches:
      - PowerPC
    paths:
      - src/powerpc/IODVDStorageFamily-30/IODVDStorageFamily.xcodeproj/project.pbxproj
      - src/releases/10.6.8/IODVDStorageFamily-30/IODVDStorageFamily.xcodeproj/project.pbxproj
      - patches/IODVDStorageFamily-30-ppc-kext-arch.patch
      - tests/test_iodvd_kext_ppc_arch.py
      - .github/workflows/iodvd-kext-ppc-source.yml

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Verify PPC target settings and exact source patch
        run: python3 -m unittest discover -s tests -p 'test_iodvd_kext_ppc_arch.py' -v
