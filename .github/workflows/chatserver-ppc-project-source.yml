name: ChatServer PPC project source regression

on:
  pull_request:
    branches:
      - PowerPC
    paths:
      - src/powerpc/ChatServer-326.5/ChatServer2.xcodeproj/project.pbxproj
      - src/powerpc/ChatServer-326.5/Makefile
      - src/releases/10.6.8/ChatServer-326.5/ChatServer2.xcodeproj/project.pbxproj
      - patches/ChatServer-326.5-ppc-project-arch.patch
      - tests/test_chatserver_ppc_project_arch.py
      - .github/workflows/chatserver-ppc-project-source.yml
  push:
    branches:
      - PowerPC
    paths:
      - src/powerpc/ChatServer-326.5/ChatServer2.xcodeproj/project.pbxproj
      - src/powerpc/ChatServer-326.5/Makefile
      - src/releases/10.6.8/ChatServer-326.5/ChatServer2.xcodeproj/project.pbxproj
      - patches/ChatServer-326.5-ppc-project-arch.patch
      - tests/test_chatserver_ppc_project_arch.py
      - .github/workflows/chatserver-ppc-project-source.yml

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check ChatServer PPC project source and exact patch
        run: python3 -m unittest discover -s tests -p 'test_chatserver_ppc_project_arch.py' -v
